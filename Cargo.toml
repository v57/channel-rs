[workspace]
members = [
  "crates/channel-rs-core",
  "crates/channel-rs-client",
  "crates/channel-rs-server",
  "crates/channel-rs-process",
  "crates/channel-rs", "crates/channel-rs-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dimas"]

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.11"
dashmap = "6.1"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
simd-json = { version = "0.15", features = ["serde_impl"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "io-util", "io-std", "signal"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.24"
url = "2.5"
